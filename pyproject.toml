[project]
name = "eth-oracle"
version = "0.1.0"
description = "Multi-factor next-day Ethereum direction forecasting research app"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::pandas.errors.PerformanceWarning",
    "ignore::DeprecationWarning:sklearn",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
